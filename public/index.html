<!DOCTYPE html>
<html>
<head>
  <title>Paster</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/index.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <i data-lucide="clipboard" style="width: 32px; height: 32px; vertical-align: middle; margin-right: 8px;"></i>
        Paster

        <small>Logado como: <strong id="username"></strong></small>
      </h1>
      <button id="adminButton" class="btn-admin" onclick="window.location.href='/admin.html'">
        <i data-lucide="shield"></i>
        <span>Administrar</span>
      </button>
    </div>

    <div class="textarea-container">
      <textarea id="content" placeholder="Cole qualquer coisa aqui ou arraste um arquivo..."></textarea>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="wordWrap" onchange="toggleWordWrap()">
          <span>Quebra de Linha</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="autoSave" onchange="toggleAutoSave()">
          <span>Enviar Automaticamente</span>
        </label>
      </div>
    </div>
    <div class="button-group">
      <div class="button-group-left">
        <button class="btn-secondary btn-icon-expand" onclick="copyContent()">
          <i data-lucide="copy"></i>
          <span>Copiar</span>
        </button>
        <button class="btn-tertiary btn-icon-expand" onclick="document.getElementById('fileInput').click()">
          <i data-lucide="upload"></i>
          <span>Carregar Arquivo</span>
        </button>
      </div>
      <button class="btn-primary" onclick="sendContent()">
        <i data-lucide="send"></i>
        <span>Enviar</span>
      </button>
    </div>
    <input type="file" id="fileInput" onchange="loadFile(event)">
    <div id="message" class="message">Enviado com sucesso!</div>
  </div>
  <script src="/index.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
